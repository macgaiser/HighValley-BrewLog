{% extends "base.html" %}
{% block title %}Messung bearbeiten – HighValley BrewLog{% endblock %}
{% block content %}
<h1>Gärverlauf-Messung bearbeiten</h1>
<p class="subtitle">Sud #{{ batch.batch_number }} – {{ batch.name }}</p>
<form class="card" method="post" action="/batches/{{ batch.id }}/fermentation/{{ entry.id }}/edit">
  <div class="field-row">
    <div><label>Datum</label><input type="date" name="entry_date" value="{{ entry.entry_date or today }}"></div>
    <div><label>°Brix</label><input type="number" step="0.1" name="brix" value="{{ entry.brix if entry.brix is not none else '' }}"></div>
  </div>
  <label>Kommentar</label>
  <input type="text" name="comment" value="{{ entry.comment }}">

  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Speichern</button>
    <a class="btn" href="/batches/{{ batch.id }}">Abbrechen</a>
  </div>
</form>
{% endblock %}
