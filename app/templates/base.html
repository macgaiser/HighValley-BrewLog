<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HighValley BrewLog{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon-64.png">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/batches">
      <span class="brand-logo"><img src="/static/img/logo-shield.png" alt="7449 High Valley Brew Co."></span>
      <span>HighValley BrewLog</span>
    </a>
    <nav>
      <a href="/batches">Sude</a>
      <a href="/inventory">Lagerbestand</a>
      <a href="/settings">Einstellungen</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
