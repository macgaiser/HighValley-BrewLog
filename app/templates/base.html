<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HighValley BrewLog{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon-64.png">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/static/vendor/flatpickr/flatpickr.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/batches">
      <span class="brand-logo"><img src="/static/img/logo-shield.png" alt="7449 High Valley Brew Co."></span>
      <span class="brand-wordmark">
        <span class="brand-number">7449</span>
        <span class="brand-line">
          <span class="brand-name">HIGH VALLEY</span>
          <span class="brand-suffix">BrewLog</span>
        </span>
      </span>
    </a>
    <nav>
      <a class="btn nav-btn" href="/batches">Sude</a>
      <a class="btn nav-btn" href="/inventory">Lagerbestand</a>
      <a class="btn nav-btn nav-btn-icon" href="/settings" aria-label="Einstellungen" title="Einstellungen">⚙</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/vendor/flatpickr/flatpickr.min.js"></script>
  <script src="/static/vendor/flatpickr/de.js"></script>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
