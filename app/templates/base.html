<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HighValley BrewLog{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon-64.png">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/static/vendor/flatpickr/flatpickr.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <g id="icon-stein">
        <rect x="7" y="9" width="12" height="14" rx="1.5" fill="var(--icon-2)"/>
        <rect x="7" y="9" width="12" height="14" rx="1.5" fill="none" stroke="var(--icon-1)" stroke-width="1.6"/>
        <path d="M19 12h2.5a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H19" fill="none" stroke="var(--icon-1)" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M7.5 9c1-3.5 3-5.5 5.5-5.5s4.5 2 5.5 5.5" fill="none" stroke="var(--icon-1)" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="13" cy="9" rx="6" ry="1.6" fill="white" stroke="var(--icon-1)" stroke-width="1"/>
      </g>
      <g id="icon-barrel">
        <path d="M8.4,0.24 L25.67,0.24 L25.79,0.63 L26.38,3 L27.21,6.94 L27.84,10.88 L28,13.25 L28,14.83 L27.84,17.19 L27.21,21.14 L26.38,25.08 L25.79,27.45 L8.32,27.45 L7.73,25.08 L6.9,21.14 L6.27,17.19 L6.11,14.83 L6.11,13.25 L6.27,10.88 L6.9,6.94 L7.73,3 L8.32,0.63 Z" fill="var(--icon-2)"/>
        <g fill="none" stroke="var(--icon-1)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.4,0.24 L25.67,0.24 L25.79,0.63 L26.38,3 L27.21,6.94 L27.84,10.88 L28,13.25 L28,14.83 L27.84,17.19 L27.21,21.14 L26.38,25.08 L25.79,27.45 L8.32,27.45 L7.73,25.08 L6.9,21.14 L6.27,17.19 L6.11,14.83 L6.11,13.25 L6.27,10.88 L6.9,6.94 L7.73,3 L8.32,0.63 Z"/>
          <line x1="7.73" y1="2.76" x2="26.38" y2="2.76"/>
          <line x1="7.73" y1="25.08" x2="26.38" y2="25.08"/>
          <line x1="10.29" y1="2.76" x2="10.29" y2="25.08"/>
          <line x1="14.08" y1="2.76" x2="14.08" y2="25.08"/>
          <line x1="19.99" y1="2.76" x2="19.99" y2="25.08"/>
          <line x1="23.86" y1="2.76" x2="23.86" y2="25.08"/>
          <path d="M2.41,16.88 L4.3,16.88"/>
          <path d="M3.35,16.88 L3.35,19.36 L7.3,19.36"/>
          <path d="M3.35,19.36 L1.18,19.36 L1.18,23.11 L3.15,23.11"/>
        </g>
      </g>
      <g id="icon-grain">
        <line x1="14" y1="24" x2="14" y2="7" stroke="var(--icon-2)" stroke-width="1.8" stroke-linecap="round"/>
        <g fill="var(--icon-2)">
          <ellipse cx="11" cy="10" rx="2.3" ry="1.4" transform="rotate(-40 11 10)"/>
          <ellipse cx="17" cy="10" rx="2.3" ry="1.4" transform="rotate(40 17 10)"/>
          <ellipse cx="10.2" cy="14.5" rx="2.3" ry="1.4" transform="rotate(-40 10.2 14.5)"/>
          <ellipse cx="17.8" cy="14.5" rx="2.3" ry="1.4" transform="rotate(40 17.8 14.5)"/>
          <ellipse cx="11" cy="19" rx="2.3" ry="1.4" transform="rotate(-40 11 19)"/>
          <ellipse cx="17" cy="19" rx="2.3" ry="1.4" transform="rotate(40 17 19)"/>
          <ellipse cx="14" cy="6" rx="1.6" ry="2.2"/>
        </g>
      </g>
      <g id="icon-sliders">
        <g stroke="var(--icon-1)" stroke-width="2" stroke-linecap="round">
          <line x1="8" y1="5" x2="8" y2="23"/>
          <line x1="14" y1="5" x2="14" y2="23"/>
          <line x1="20" y1="5" x2="20" y2="23"/>
        </g>
        <circle cx="8" cy="17" r="2.8" fill="var(--icon-2)" stroke="var(--icon-1)" stroke-width="1.4"/>
        <circle cx="14" cy="10" r="2.8" fill="var(--icon-2)" stroke="var(--icon-1)" stroke-width="1.4"/>
        <circle cx="20" cy="14" r="2.8" fill="var(--icon-2)" stroke="var(--icon-1)" stroke-width="1.4"/>
      </g>
    </defs>
  </svg>
  <header class="topbar">
    <a class="brand" href="/batches">
      <span class="brand-logo"><img src="/static/img/logo-shield.png" alt="7449 High Valley Brew Co."></span>
      <span class="brand-wordmark">
        <span class="brand-number">7449</span>
        <span class="brand-line">
          <span class="brand-name">HIGH VALLEY</span>
          <span class="brand-suffix">BrewLog</span>
        </span>
      </span>
    </a>
    <nav>
      <a class="tab-nav {{ 'active' if request.url.path.startswith('/batches') else '' }}" href="/batches">
        <svg class="tab-nav-icon"><use href="#icon-stein"/></svg><span class="tab-nav-label">Sude</span>
      </a>
      <a class="tab-nav {{ 'active' if request.url.path.startswith('/inventory') else '' }}" href="/inventory">
        <svg class="tab-nav-icon"><use href="#icon-grain"/></svg><span class="tab-nav-label">Lagerbestand</span>
      </a>
      <a class="tab-nav tab-nav-settings {{ 'active' if request.url.path.startswith('/settings') else '' }}" href="/settings" aria-label="Einstellungen" title="Einstellungen">
        <svg class="tab-nav-icon"><use href="#icon-sliders"/></svg><span class="tab-nav-label">Einstellungen</span>
      </a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/vendor/flatpickr/flatpickr.min.js"></script>
  <script src="/static/vendor/flatpickr/de.js"></script>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
