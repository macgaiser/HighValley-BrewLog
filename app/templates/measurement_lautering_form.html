{% extends "base.html" %}
{% block title %}Läuterung bearbeiten – HighValley BrewLog{% endblock %}
{% block content %}
<h1>Läuterung bearbeiten</h1>
<p class="subtitle">Sud #{{ batch.batch_number }} – {{ batch.name }}</p>
<form class="card" method="post" action="/batches/{{ batch.id }}/measurements/lautering">
  <div class="field-row">
    <div><label>vor Läutern (°Brix)</label><input type="number" step="0.1" name="pre_lauter_brix" value="{{ batch.pre_lauter_brix if batch.pre_lauter_brix is not none else '' }}"></div>
    <div><label>nach Läutern (°Brix)</label><input type="number" step="0.1" name="post_lauter_brix" value="{{ batch.post_lauter_brix if batch.post_lauter_brix is not none else '' }}"></div>
    <div><label>Menge nach Läutern (l)</label><input type="number" step="0.1" name="post_lauter_volume_l" value="{{ batch.post_lauter_volume_l if batch.post_lauter_volume_l is not none else '' }}"></div>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Speichern</button>
    <a class="btn" href="/batches/{{ batch.id }}">Abbrechen</a>
  </div>
</form>
{% endblock %}
